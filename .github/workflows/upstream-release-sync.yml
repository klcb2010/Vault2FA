name: Upstream release sync

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-release-sync
  cancel-in-progress: false

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync new upstream release while preserving local mods
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/DrJason33564/Vault2FA.git
          git fetch upstream --tags --prune

          upstream_latest="$(gh api repos/DrJason33564/Vault2FA/releases/latest --jq .tag_name)"
          previous="$(cat mod/upstream-release.txt 2>/dev/null || true)"
          echo "Latest upstream=$upstream_latest Previous=$previous"

          if [[ -n "$upstream_latest" && "$upstream_latest" != "$previous" ]]; then
            backup="$(mktemp -d)"
            cp -a mod "$backup/mod"
            [[ ! -d .github/workflows ]] || cp -a .github/workflows "$backup/workflows"
            [[ ! -d .github/actions ]] || cp -a .github/actions "$backup/actions"
            [[ ! -f README.md ]] || cp README.md "$backup/README.md"
            [[ ! -f README.EN.md ]] || cp README.EN.md "$backup/README.EN.md"

            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' merge --no-edit -X ours "$upstream_latest"

            rm -rf mod
            cp -a "$backup/mod" mod
            if [[ -d "$backup/workflows" ]]; then
              rm -rf .github/workflows
              mkdir -p .github
              cp -a "$backup/workflows" .github/workflows
            fi
            if [[ -d "$backup/actions" ]]; then
              rm -rf .github/actions
              mkdir -p .github
              cp -a "$backup/actions" .github/actions
            fi
            [[ ! -f "$backup/README.md" ]] || cp "$backup/README.md" README.md
            [[ ! -f "$backup/README.EN.md" ]] || cp "$backup/README.EN.md" README.EN.md

            python3 mod/apply.py
            printf '%s\n' "$upstream_latest" > mod/upstream-release.txt
            git add -A
            if ! git diff --cached --quiet; then
              git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Sync upstream release $upstream_latest with local mods"
            else
              echo "No file changes were needed after upstream merge."
            fi

            git push origin HEAD:main
          else
            echo "No new upstream release. Continue to local release check."
          fi

      - name: Package and publish Firefox XPI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags
          git fetch upstream --tags
          git checkout main
          git pull --ff-only origin main

          # Only package when committed, package-relevant files changed since the
          # latest published local build. README/workflow-only commits must not
          # create a new XPI release.
          last_published_tag="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"
          if [[ -n "$last_published_tag" ]]; then
            if git diff --quiet "${last_published_tag}..HEAD" -- . \
              ':(exclude)README*' \
              ':(exclude).github/**'; then
              echo "No package-relevant committed changes since ${last_published_tag}; skip packaging."
              exit 0
            fi
            echo "Package-relevant changes detected since ${last_published_tag}."
          else
            echo "No previous local release tag; perform the initial package."
          fi

          # Apply all local mod injections only after confirming there are
          # committed package-relevant changes to publish.
          python3 mod/apply.py

          # Fail the build before publishing if injected popup JavaScript is invalid.
          node --check popup/popup.js
          node --check locales/i18n.js
          node --check background/context-menu.js
          node --check autofill/autofill-content.js

          upstream_release="$(gh api repos/DrJason33564/Vault2FA/releases/latest)"
          upstream_latest="$(jq -r '.tag_name // empty' <<< "$upstream_release")"
          upstream_release_notes="$(jq -r '.body // empty' <<< "$upstream_release")"
          if [[ -z "$upstream_latest" ]]; then
            echo "Cannot determine upstream release tag."
            exit 1
          fi
          if [[ -z "${upstream_release_notes//[[:space:]]/}" ]]; then
            upstream_release_notes="上游版本：$upstream_latest

          上游未提供详细发布说明。"
          fi

          base_version="${upstream_latest#v}"
          head_sha="$(git rev-parse HEAD)"
          last_local_tag="$(git tag --list "v${base_version}.*" --sort=-version:refname | head -n 1)"

          if [[ -n "$last_local_tag" ]] && [[ "$(git rev-parse "$last_local_tag^{commit}")" == "$head_sha" ]]; then
            release_tag="$last_local_tag"
          else
            next_revision="$(git tag --list "v${base_version}.*" |
              sed -E "s/^v${base_version//./\\.}\\.([0-9]+)$/\\1/" |
              grep -E '^[0-9]+$' |
              sort -n | tail -n 1 || true)"
            next_revision="$(( ${next_revision:-0} + 1 ))"
            release_tag="v${base_version}.${next_revision}"
          fi

          release_version="${release_tag#v}"
          package_dir="$(mktemp -d)"
          mkdir -p "$package_dir/xpi"

          rsync -a ./ "$package_dir/xpi/" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='mod/' \
            --exclude='Vault2FA.xpi'

          jq --arg version "$release_version" '.version = $version' \
            "$package_dir/xpi/manifest.json" > "$package_dir/manifest.json"
          mv "$package_dir/manifest.json" "$package_dir/xpi/manifest.json"

          (cd "$package_dir/xpi" && zip -qr "$GITHUB_WORKSPACE/Vault2FA.xpi" .)

          echo "Prepared unsigned Firefox package: Vault2FA.xpi ($release_version)"

          if gh release view "$release_tag" --repo klcb2010/Vault2FA >/dev/null 2>&1; then
            echo "Release $release_tag already exists; refreshing its notes and XPI asset."
            gh release edit "$release_tag" \
              --repo klcb2010/Vault2FA \
              --notes "$upstream_release_notes"
          else
            gh release create "$release_tag" \
              --repo klcb2010/Vault2FA \
              --target "$head_sha" \
              --title "Vault2FA $release_tag" \
              --notes "$upstream_release_notes"
          fi

          gh release upload "$release_tag" "$GITHUB_WORKSPACE/Vault2FA.xpi" \
            --repo klcb2010/Vault2FA \
            --clobber
